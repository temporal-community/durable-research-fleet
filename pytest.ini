[pytest]
asyncio_mode = auto
# Both scopes must match, or a module-scoped server fixture and a function-scoped
# test loop deadlock — the test hangs with no output at all.
asyncio_default_fixture_loop_scope = module
asyncio_default_test_loop_scope = module
testpaths = tests
# Never let a hang look like a slow test again.
addopts = -q --strict-markers --timeout=120
